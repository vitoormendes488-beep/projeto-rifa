<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Login</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; text-align: center; padding: 60px 20px; }
        .card { max-width: 320px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
        input { width: 100%; padding: 12px; font-size: 16px; margin-top: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; margin-top: 15px; padding: 12px; background: #2c3e50; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .erro { color: #e74c3c; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Área Administrativa</h2>
        {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
        <form method="POST">
            <input type="password" name="senha" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
